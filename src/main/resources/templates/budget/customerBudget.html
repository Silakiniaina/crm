<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <div th:insert="~{/general/head.html}"></div>
    <meta name="_csrf" content="${_csrf.token}"/>
    <meta name="_csrf_header" content="${_csrf.headerName}"/>

    <!-- Editable CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/dataTables.bootstrap4.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/css/responsive.dataTables.min.css}">
    <link th:href="@{/css/login-register-lock.css}" rel="stylesheet">
    <link th:href="@{/css/jquery.toast.css}" rel="stylesheet">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.min.css}" rel="stylesheet">
    <!-- page css -->
    <link th:href="@{/css/pages/inbox.css}" rel="stylesheet">

    <!-- HTML5 Shim and Respond.js IE8 support -->
    <!--[if lt IE 9]>
    <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
    <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body class="skin-blue fixed-layout">
    <div class="preloader">
        <div class="loader">
            <div class="loader__figure"></div>
            <p class="loader__label">CRM</p>
        </div>
    </div>

    <div id="main-wrapper">
        <div th:insert="~{/general/header.html}"></div>
        <div th:insert="~{/general/left-sidebar.html}"></div>

        <div class="page-wrapper">
            <div class="container-fluid">
                <div th:insert="~{/general/page-titles.html}"></div>

                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div class="card-body">
                                <div th:if="${errorMessage}" class="alert alert-danger">
                                    <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                        <span aria-hidden="true">&times;</span>
                                    </button>
                                    <h3 class="text-info">
                                        <i class="fa fa-exclamation-circle"></i> Error
                                    </h3>
                                    <span th:text="${errorMessage}"></span>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h4 class="card-title">Customer Budgets</h4>
                                    <!-- Add Budget button visible only to managers -->
                                    <div th:if="${#authorization.expression('hasRole(''ROLE_MANAGER'')')}">
                                        <a th:href="@{/customer/{id}/budgets/add(id=${customerId})}" 
                                           class="btn btn-primary">
                                            <i class="fas fa-plus"></i> Add Budget
                                        </a>
                                    </div>
                                </div>

                                <div class="table-responsive m-t-40">
                                    <table id="budget-table" class="table display table-bordered table-striped no-wrap">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Amount</th>
                                                <th>Created At</th>
                                                <th>Created By</th>
                                                <th>Customer</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="budget : ${customerBudgets}">
                                                <td th:text="${budget.id}"></td>
                                                <td th:text="${#numbers.formatDecimal(budget.amount, 1, 2)}"></td>
                                                <td th:text="${budget.createdAt}"></td>
                                                <td th:text="${budget.createdBy.username}"></td>
                                                <td th:text="${budget.customer.name}"></td>
                                            </tr>
                                            <tr th:unless="${customerBudgets} and ${#lists.size(customerBudgets) > 0}">
                                                <td colspan="5" class="text-center">No budgets found</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:insert="~{/general/footer.html}"></div>
    </div>

    <!-- JavaScript dependencies -->
    <script th:inline="javascript">
        var home = /*[[${home}]]*/ null;
    </script>
    <script th:src="@{/js/library/jquery-3.2.1.min.js}"></script>
    <script th:src="@{/js/library/popper.min.js}"></script>
    <script th:src="@{/js/library/bootstrap.min.js}"></script>
    <script th:src="@{/js/library/perfect-scrollbar.jquery.min.js}"></script>
    <script th:src="@{/js/library/waves.js}"></script>
    <script th:src="@{/js/library/sidebarmenu.js}"></script>
    <script th:src="@{/js/library/sticky-kit.min.js}"></script>
    <script th:src="@{/js/library/jquery.sparkline.min.js}"></script>
    <script th:src="@{/js/library/custom.min.js}"></script>
    <script th:src="@{/js/library/jquery.toast.js}"></script>
    <script th:src="@{/js/library/toastr.js}"></script>
    <script th:src="@{/js/library/jquery.dataTables.min.js}"></script>
    <script th:src="@{/js/library/dataTables.responsive.min.js}"></script>
    
    <script>
        $('#budget-table').DataTable({
            responsive: true
        });
    </script>
</body>
</html>
