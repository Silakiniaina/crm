<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="~{/general/head.html}"></div>
<meta name="_csrf" content="${_csrf.token}"/>
<meta name="_csrf_header" content="${_csrf.headerName}"/>

<!-- Editable CSS -->
<link rel="stylesheet" type="text/css"
      th:href="@{/css/dataTables.bootstrap4.css}">
<link rel="stylesheet" type="text/css"
      th:href="@{/css/responsive.dataTables.min.css}">

<!-- Custom CSS -->
<link th:href="@{/css/style.min.css}" rel="stylesheet">
<!-- page css -->
<link th:href="@{/css/pages/inbox.css}" rel="stylesheet">

<!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
<!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
<!--[if lt IE 9]>
<script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
<script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
<![endif]-->
</head>

<body class="skin-blue fixed-layout">
<!-- ============================================================== -->
<!-- Preloader - style you can find in spinners.css -->
<!-- ============================================================== -->
<div class="preloader">
    <div class="loader">
        <div class="loader__figure"></div>
        <p class="loader__label">CRM</p>
    </div>
</div>
<!-- ============================================================== -->
<!-- Main wrapper - style you can find in pages.scss -->
<!-- ============================================================== -->
<div id="main-wrapper">
    <!-- ============================================================== -->
    <!-- Topbar header - style you can find in pages.scss -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/header.html}"></div>
    <!-- ============================================================== -->
    <!-- End Topbar header -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- Left Sidebar - style you can find in sidebar.scss  -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/left-sidebar.html}"></div>
    <!-- ============================================================== -->
    <!-- End Left Sidebar - style you can find in sidebar.scss  -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- Page wrapper  -->
    <!-- ============================================================== -->
    <div class="page-wrapper">
        <!-- ============================================================== -->
        <!-- Container fluid  -->
        <!-- ============================================================== -->
        <div class="container-fluid">
            <!-- ============================================================== -->
            <!-- Bread crumb and right sidebar toggle -->
            <!-- ============================================================== -->
            <div th:insert="~{/general/page-titles.html}"></div>
            <!-- ============================================================== -->
            <!-- End Bread crumb and right sidebar toggle -->
            <!-- ============================================================== -->
            <!-- ============================================================== -->
            <!-- Start Page Content -->
            <!-- ============================================================== -->
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Expenses</h4>
                            <!-- Filter controls -->
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <form id="filterForm" method="get" th:action="@{/expenses}">
                                        <div class="form-row align-items-center">
                                            <div class="col-auto">
                                                <label for="type">Type: </label>
                                                <select class="form-control" id="type" name="type">
                                                    <option value="">All Types</option>
                                                    <option value="1" th:selected="${#strings.equals(param.type, '1')}">Lead</option>
                                                    <option value="2" th:selected="${#strings.equals(param.type, '2')}">Ticket</option>
                                                </select>                                                
                                            </div>
                                            <div class="col-auto">
                                                <label for="id">ID:</label>
                                                <input type="text" class="form-control" id="id" name="id" 
                                                       th:value="${param.id}" placeholder="Lead/Ticket ID">
                                            </div>
                                            <div class="col-auto align-self-end">
                                                <button type="submit" class="btn btn-primary mb-2">Filter</button>
                                                <a th:href="@{/expenses}" class="btn btn-secondary mb-2">Reset</a>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                                <!-- Replace the problematic "New Expense" button code (around line 106) with this: -->
                                <div class="col-md-6 text-right">
                                    <a id="addExpenseBtn" 
                                    th:class="${param.type != null and param.type != '' and param.id != null and param.id != '' ? 'btn btn-info' : 'btn btn-info disabled'}"
                                    th:href="@{/expenses/add(type=${param.type}, id=${param.id})}"
                                    class="btn btn-info">
                                        <i class="fa fa-plus"></i> New Expense
                                    </a>
                                </div>
                            </div>
                            <div class="table-responsive m-t-40">
                                <table id="config-table" class="table display table-bordered table-striped no-wrap">
                                    <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Date</th>
                                        <th>Label</th>
                                        <th>Amount</th>
                                        <th>Type</th>
                                        <th>Related To</th>
                                        <th>Created By</th>
                                        <th>Edit</th>
                                        <th>Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody>
                                    <tr th:if="${expenses != null}" th:each="expense : ${expenses}">
                                        <td th:text="${expense.id}"></td>
                                        <td th:text="${#temporals.format(expense.createdAt, 'yyyy-MM-dd')}"></td>
                                        <td th:text="${expense.label}"></td>
                                        <td th:text="${#numbers.formatCurrency(expense.amount)}"></td>
                                        <td>
                                            <span th:switch="${expense.expenseType}">
                                                <span th:case="1">Ticket</span>
                                                <span th:case="2">Lead</span>
                                            </span>
                                        </td>
                                        <td>
                                            <span th:if="${expense.lead != null}">
                                                Lead: <a th:href="${home + 'employee/lead/show/' + expense.lead.leadId}" 
                                                        th:text="${expense.lead.name}"></a>
                                            </span>
                                            <span th:if="${expense.ticket != null}">
                                                Ticket: <a th:href="${home + 'employee/ticket/show/' + expense.ticket.ticketId}" 
                                                         th:text="${expense.ticket.subject}"></a>
                                            </span>
                                        </td>
                                        <td th:text="${expense.createdBy != null ? expense.createdBy.username : 'N/A'}"></td>
                                        <td><a th:href="${home + 'employee/expense/update/' + expense.id}"><i class="fas fa-edit"></i></a></td>
                                        <td>
                                            <form th:action="${home + 'employee/expense/delete/' + expense.id}" method="post">
                                                <button type="submit" class="btn btn-primary">
                                                    <i class="mdi mdi-delete"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- ============================================================== -->
            <!-- End Page Content -->
            <!-- ============================================================== -->
            <!-- ============================================================== -->
            <!-- Right sidebar -->
            <!-- ============================================================== -->
            <!-- .right-sidebar -->
            <div th:insert="~{/general/right-sidebar.html}"></div>
            <!-- ============================================================== -->
            <!-- End Right sidebar -->
            <!-- ============================================================== -->
        </div>
        <!-- ============================================================== -->
        <!-- End Container fluid  -->
        <!-- ============================================================== -->
    </div>
    <!-- ============================================================== -->
    <!-- End Page wrapper  -->
    <!-- ============================================================== -->
    <!-- ============================================================== -->
    <!-- footer -->
    <!-- ============================================================== -->
    <div th:insert="~{/general/footer.html}"></div>
    <!-- ============================================================== -->
    <!-- End footer -->
    <!-- ============================================================== -->
</div>
<!-- ============================================================== -->
<!-- End Wrapper -->
<!-- ============================================================== -->
<!-- ============================================================== -->
<!-- All Jquery -->
<!-- ============================================================== -->
<script th:inline="javascript">
    var home = /*[[${home}]]*/ null;
</script>
<script th:src="@{/js/library/jquery-3.2.1.min.js}" type="text/javascript">></script>
<!--    &lt;!&ndash; Bootstrap tether Core JavaScript &ndash;&gt;-->
<script th:src="@{/js/library/popper.min.js}" type="text/javascript">></script>
<script th:src="@{/js/library/bootstrap.min.js}" type="text/javascript">></script>
<!--    &lt;!&ndash; slimscrollbar scrollbar JavaScript &ndash;&gt;-->
<script th:src="@{/js/library/perfect-scrollbar.jquery.min.js}" type="text/javascript">></script>
<!--Wave Effects -->
<script th:src="@{/js/library/waves.js}" type="text/javascript">></script>
<!--Menu sidebar -->
<script th:src="@{/js/library/sidebarmenu.js}" type="text/javascript">></script>
<!--stickey kit -->
<script th:src="@{/js/library/sticky-kit.min.js}"></script>
<script th:src="@{/js/library/jquery.sparkline.min.js}" type="text/javascript">></script>
<!--Custom JavaScript -->
<script th:src="@{/js/library/custom.min.js}" type="text/javascript">></script>
<!-- Editable -->
<script th:src="@{/js/library/jquery.dataTables.min.js}"></script>
<script th:src="@{/js/library/dataTables.responsive.min.js}"></script>
<script>
    $(document).ready(function() {
        $('#config-table').DataTable({
            responsive: true
        });

        
        // Dynamic button state management
        function updateAddButtonState() {
            var typeValue = $('#type').val();
            var idValue = $('#id').val();
            
            if (typeValue && idValue) {
                // Both fields have values
                $('#addExpenseBtn').removeClass('disabled');
                $('#addExpenseBtn').attr('href', '/expenses/add?type=' + typeValue + '&id=' + idValue);
            } else {
                // At least one field is empty
                $('#addExpenseBtn').addClass('disabled');
                $('#addExpenseBtn').attr('href', '#');
            }
        }
        
        // Initial check
        updateAddButtonState();
        
        // Add listeners to update button state when filter values change
        $('#type, #id').on('change keyup', function() {
            updateAddButtonState();
        });
    });
</script>
<style>
    .disabled {
        pointer-events: none;
        opacity: 0.6;
        cursor: not-allowed;
    }
</style>
</body>
</html>
