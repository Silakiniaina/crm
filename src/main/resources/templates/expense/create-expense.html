<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:insert="~{/general/head.html}"></div>
<meta name="_csrf" content="${_csrf.token}"/>
<meta name="_csrf_header" content="${_csrf.headerName}"/>
<link rel="stylesheet" th:href="@{/css/bootstrap-wysihtml5.css}"/>
<!-- Custom CSS -->
<link th:href="@{/css/style.min.css}" rel="stylesheet">
<!-- page css -->
<link th:href="@{/css/pages/inbox.css}" rel="stylesheet">

<!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->
<!--[if lt IE 9]>
<script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
<script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
<![endif]-->
</head>

<body class="skin-blue fixed-layout">
<!-- Preloader -->
<div class="preloader">
    <div class="loader">
        <div class="loader__figure"></div>
        <p class="loader__label">CRM</p>
    </div>
</div>
<!-- Main wrapper -->
<div id="main-wrapper">
    <!-- Topbar header -->
    <div th:insert="~{/general/header.html}"></div>
    <!-- Left Sidebar -->
    <div th:insert="~{/general/left-sidebar.html}"></div>
    <!-- Page wrapper -->
    <div class="page-wrapper">
        <!-- Container fluid -->
        <div class="container-fluid">
            <!-- Bread crumb and right sidebar toggle -->
            <div th:insert="~{/general/page-titles.html}"></div>
            <!-- Start Page Content -->
            <div class="row">
                <div class="col-lg-12">
                    <!-- Alert for success message -->
                    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                        <strong>Success!</strong> <span th:text="${successMessage}"></span>
                    </div>
                    
                    <!-- Alert for error message -->
                    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                        <strong>Error!</strong> <span th:text="${errorMessage}"></span>
                    </div>
                    
                    <div class="card">
                        <div class="card-body">
                            <h4 class="card-title">Add New Expense</h4>
                            <form th:object="${expense}" th:action="@{/expenses}" method="post">
                                <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                                <input type="hidden" name="type" th:value="${type}"/>
                                <input type="hidden" name="id" th:value="${id}" th:if="${id != null}"/>
                                
                                <label class="m-t-20" for="label">Label:</label>
                                <div class="input-group">
                                    <input type="text" id="label" th:field="*{label}" class="form-control" required>
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('label')}" th:errors="*{label}"></span>
                                </div>

                                <label class="m-t-20" for="description">Description:</label>
                                <div class="input-group">
                                    <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
                                </div>

                                <label class="m-t-20" for="amount">Amount:</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">$</span>
                                    </div>
                                    <input type="number" id="amount" th:field="*{amount}" class="form-control" step="0.01" min="0" required>
                                </div>
                                <div class="input-group">
                                    <span class="text-danger font-weight-bold" th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></span>
                                </div>

                                <button type="submit" class="btn btn-primary m-t-20">Save Expense</button>
                                <a th:href="@{/expenses}" class="btn btn-secondary m-t-20 m-l-10">Cancel</a>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- End Page Content -->
            <!-- Right sidebar -->
            <div th:insert="~{/general/right-sidebar.html}"></div>
            <!-- End Right sidebar -->
        </div>
        <!-- End Container fluid -->
    </div>
    <!-- End Page wrapper -->
    <!-- footer -->
    <div th:insert="~{/general/footer.html}"></div>
    <!-- End footer -->
</div>
<!-- End Wrapper -->
<!-- All Jquery -->
<script th:inline="javascript">
    var home = /*[[${home}]]*/ null;
</script>
<script th:src="@{/js/library/jquery-3.2.1.min.js}" type="text/javascript">></script>
<!-- Bootstrap tether Core JavaScript -->
<script th:src="@{/js/library/popper.min.js}" type="text/javascript">></script>
<script th:src="@{/js/library/bootstrap.min.js}" type="text/javascript">></script>
<!-- slimscrollbar scrollbar JavaScript -->
<script th:src="@{/js/library/perfect-scrollbar.jquery.min.js}" type="text/javascript">></script>
<!--Wave Effects -->
<script th:src="@{/js/library/waves.js}" type="text/javascript">></script>
<!--Menu sidebar -->
<script th:src="@{/js/library/sidebarmenu.js}" type="text/javascript">></script>
<!--stickey kit -->
<script th:src="@{/js/library/sticky-kit.min.js}"></script>
<script th:src="@{/js/library/jquery.sparkline.min.js}" type="text/javascript">></script>
<!--Custom JavaScript -->
<script th:src="@{/js/library/custom.min.js}" type="text/javascript">></script>

<!-- Auto-dismiss alerts after 5 seconds -->
<script>
    $(document).ready(function() {
        // Auto dismiss alerts after 5 seconds
        window.setTimeout(function() {
            $(".alert").fadeTo(500, 0).slideUp(500, function(){
                $(this).remove(); 
            });
        }, 5000);
    });
</script>
</body>
</html>
